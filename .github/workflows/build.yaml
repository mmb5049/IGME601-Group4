name: "Godot Build Pipeline"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  export:
    name: Build Godot Game
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These names must match your Godot Export Preset names exactly
        platform: [windows]

    steps:
      # 1. Check out the repository (including Git LFS if you use heavy assets)
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Build the game using a trusted community GitHub Action
      - name: Godot Export
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.7.0/Godot_v4.7.0-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.7.0/Godot_v4.7.0-stable_export_templates.tpz
          relative_project_path: ././igme-601-group-4
          archive_output: true
          export_preset: ${{ matrix.platform }}

      # 3. Save the built binaries so you can download them from GitHub
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ steps.export.outputs.archive_directory }}
