name: Build Godot Project

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          include-templates: true

      - name: Import project
        run: godot --headless --editor --quit

      - name: Build Windows
        run: |
          mkdir build/windows
          godot --headless --export-release "Windows Desktop" "build/windows/Martial Matrix.exe"

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Windows Build
          path: ././igme-601-group-4/build/windows/